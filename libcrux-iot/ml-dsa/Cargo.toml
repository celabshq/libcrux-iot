[package]
name = "libcrux-iot-ml-dsa"
description = "Libcrux-IoT ML-DSA implementation"
publish = false

readme.workspace = true
version.workspace = true
repository.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true

[lib]
bench = false # so libtest doesn't eat the arguments to criterion

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# The machine-extracted FIPS-204 hacspec. A NORMAL dependency because
# `decompose_element`'s `#[ensures]` names `hacspec_ml_dsa::arithmetic::decompose`
# directly, so it must be in scope for the hax build.
#
# 6e39ccd9 is the specs commit that replaced the specs' hax_aeneas.py drivers
# with hax.toml (hax v0.4.0); it contains the polynomial/ntt-layer exposure
# (poly_infinity_norm, poly_add/sub/pointwise_mul, ntt, intt) this crate's
# #[ensures] name. The SAME commit is pinned in `proofs/lean/lakefile.toml`
# for the `HacspecMlDsa` Lean package, so the Rust side and the Lean side
# check the same spec content.
hacspec_ml_dsa = { git = "https://github.com/celabshq/libcrux.git", rev = "6e39ccd988c1ea61d8d5da591ffeb33ce3a64b45" }
libcrux-iot-sha3 = { path = "../sha3", features = ["unbuffered-xof"] }
libcrux-macros.workspace = true
hax-lib.workspace = true
libcrux-secrets.workspace = true

[dev-dependencies]
rand = { version = "0.8" }
hex = { version = "0.4.3", features = ["serde"] }
serde_json = { version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
criterion = "0.5"
pqcrypto-dilithium = { version = "0.5.0" }         #, default-features = false
libcrux-kats = { workspace = true, features = [ "mldsa"] }

[features]
default = ["mldsa44", "mldsa65", "mldsa87"]
acvp = []                                   # expose internal API for ACVP testing
test-utils = []                             # exposing internal functions for testing

# Features for the different key sizes of ML-DSA
mldsa44 = []
mldsa65 = []
mldsa87 = []

# use stack-optimized verification
stack = []

# std support
std = []

check-secret-independence = ["libcrux-secrets/check-secret-independence", "libcrux-iot-sha3/check-secret-independence"]

[[bench]]
name = "manual44"
harness = false

[[bench]]
name = "manual65"
harness = false

[[bench]]
name = "manual87"
harness = false

[[bench]]
name = "ml-dsa"
harness = false

[lints]
workspace = true
