# hax configuration for `libcrux-iot-ml-dsa`. Replaces the former `hax_aeneas.py`
# driver. Extract with `cargo hax extract` (runs the scenario below).
#
# The scenario is named after the cargo package so hax derives the existing Lean
# package name `LibcruxIotMlDsa`, and writes into the existing `proofs/lean/`
# layout (hax warns this is the scenario-less layout; that is intentional).
# The charon `--start-from` roots and `--opaque` items are the extraction scope
# the driver used to pass on the command line; they are load-bearing (without
# them the whole crate is extracted and aeneas cannot translate the SHAKE bodies).
# Tool versions are pinned workspace-wide in `../hax.toml`.
[scenario.libcrux-iot-ml-dsa]
backend = "lean"
output-dir = "proofs/lean"
charon-args = [
  "--start-from",
  "crate::ntt::*",
  "--start-from",
  "crate::polynomial::*",
  "--start-from",
  "crate::arithmetic::*",
  "--start-from",
  "crate::simd::portable::ntt::*",
  "--start-from",
  "crate::simd::portable::invntt::*",
  "--start-from",
  "crate::simd::portable::arithmetic::*",
  "--start-from",
  "crate::simd::portable::vector_type::*",
  "--start-from",
  "{impl crate::simd::traits::Operations for crate::simd::portable::vector_type::Coefficients}",
  "--start-from",
  "crate::polynomial::PolynomialRingElement::add",
  "--start-from",
  "crate::polynomial::PolynomialRingElement::subtract",
  "--start-from",
  "crate::simd::traits::*",
  "--start-from",
  "crate::matrix::compute_as1_plus_s2",
  "--start-from",
  "crate::matrix::compute_matrix_x_mask",
  "--opaque",
  "crate::hash_functions::*",
  "--opaque",
  "crate::sample::*",
  "--opaque",
  "crate::samplex4::*",
  "--opaque",
  "crate::encoding::*",
  "--opaque",
  "crate::ml_dsa_generic::*",
  "--opaque",
  "crate::pre_hash::*",
  "--opaque",
  "crate::simd::portable::encoding::*",
  "--opaque",
  "crate::simd::portable::sample::*",
  "--opaque",
  "crate::arithmetic::power2round_vector",
  "--opaque",
  "crate::arithmetic::decompose_vector",
  "--opaque",
  "crate::matrix::compute_as1_plus_s2",
  "--opaque",
  "crate::matrix::compute_matrix_x_mask"
]
