name = "LibcruxIotMlDsa"
version = "0.1.0"
defaultTargets = ["LibcruxIotMlDsa"]

[[lean_lib]]
name = "LibcruxIotMlDsa"
globs = ["LibcruxIotMlDsa", "LibcruxIotMlDsa.+"]

[[require]]
name = "Hax"
git = "https://github.com/cryspen/hax-lean"
rev = "v0.3.12"

# The machine-extracted clean-Z_q ML-DSA hacspec (crate `hacspec_ml_dsa`,
# specs/ml-dsa in celabshq/libcrux). The poly-layer spec-bridge lemmas reference
# `hacspec_ml_dsa.*`. Transitively brings in HacspecSha3.
# Local worktree path until the libcrux-side spec migration is pushed: the
# pinned rev below still carried hax-lean v0.2.0, so lake resolved aeneas to
# the old 52fd4383 and the build died inside hax-lean itself with
# "Unknown identifier `Aeneas.Std.RustM`". TODO: restore a `git`+`rev`
# require pointing at the pushed commit.
[[require]]
name = "HacspecMlDsa"
path = "../../../../../../libcrux/hax-v0.4.0-rc.1/specs/ml-dsa/proofs/lean"
