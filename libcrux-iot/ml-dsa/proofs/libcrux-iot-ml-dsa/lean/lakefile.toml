name = "LibcruxIotMlDsa"
version = "0.1.0"
defaultTargets = ["LibcruxIotMlDsa"]

[[lean_lib]]
name = "LibcruxIotMlDsa"
# No module glob: the library is driven by the `LibcruxIotMlDsa` root module's
# import tree, so the generated `Extraction/ProofObligations.lean` (sorry bodies,
# @[spec]-tagged, imported by nothing) stays on disk but OUT of the build.
globs = ["LibcruxIotMlDsa"]

[[require]]
name = "hax"
git = "https://github.com/cryspen/hax-lean"
rev = "v0.3.17"

# The machine-extracted clean-Z_q ML-DSA hacspec (crate `hacspec_ml_dsa`,
# specs/ml-dsa in celabshq/libcrux). The poly-layer spec-bridge lemmas reference
# `hacspec_ml_dsa.*`. Transitively brings in HacspecSha3.
# Pinned by COMMIT SHA, never by branch name, to the same revision the Cargo
# side pins for the crate. a0c1aaa3 names hax-lean `hax` here as well as in
# specs/sha3, so that pulling this package and HacspecSha3 yields ONE hax
# package (two spellings meant two copies of CoreModels, and an unresolvable
# `hax` dependency in this manifest).
[[require]]
name = "HacspecMlDsa"
git = "https://github.com/celabshq/libcrux"
rev = "a0c1aaa3b005f6bd50625a07d2f853275f3989d7"
subDir = "specs/ml-dsa/proofs/hacspec-ml-dsa/lean"
