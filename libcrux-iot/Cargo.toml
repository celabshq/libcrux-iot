[workspace]
members = ["ml-dsa", "ml-kem", "sha3", "aes", "p256"]
resolver = "3"

[workspace.package]
version = "0.0.3"
authors = ["CE Labs"]
license = "Apache-2.0 OR MIT"
edition = "2021"
repository = "https://github.com/celabshq/libcrux-iot"
readme = "README.md"

[workspace.dependencies]
libcrux-kats = { git = "https://github.com/celabshq/libcrux.git" }
libcrux-secrets = { version = "0.0.6" }
libcrux-macros = { version = "0.0.3" }
libcrux-traits = { version = "0.0.8" }
libcrux-hacl-rs = { version = "0.0.5" }
libcrux-sha2 = { version = "=0.0.8" }

hax-lib = { version = "0.4.0" }


[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(eurydice)',
    'cfg(doc_cfg)',
    'cfg(hax_backend_lean)',
] }

[profile.release-debug]
inherits = "release"
debug = true
strip = false
