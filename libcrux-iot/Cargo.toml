[workspace]
members = ["ml-dsa", "ml-kem", "sha3"]
resolver = "3"

[workspace.package]
version = "0.0.3"
authors = ["Cryspen"]
license = "AGPL-3.0-only"
homepage = "iot.cryspen.com"                          # TODO: Set this up
edition = "2021"
repository = "https://github.com/cryspen/libcrux-iot"
readme = "README.md"

[workspace.dependencies]
libcrux-kats = { git = "https://github.com/cryspen/libcrux.git" }
libcrux-secrets = { version = "0.0.5" }
libcrux-macros = { version = "0.0.3" }
libcrux-traits = { version = "0.0.7" }

hax-lib = { version = "0.4.0-rc.2" }


[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(hax)',
    'cfg(eurydice)',
    'cfg(doc_cfg)',
    'cfg(hax_backend_lean)',
] }

[patch.crates-io]
# cargo-hax v0.4.0-rc.2 rejects hax-lib < 0.4 ("too old for this cargo-hax").
# This replaces the stale jonas/fstar-wrapping patch (last touched 2026-01-20).
hax-lib = { git = "https://github.com/cryspen/hax", rev = "cbce2c3bfcf50e853d3115c45cd592004d7d092f" }
# patch until libcrux-secrets 0.0.6 is released
libcrux-secrets = { git = "https://github.com/cryspen/libcrux.git", rev = "c4253d211a605f4a284c595fc6ca28ae18dd07ba" }

[profile.release-debug]
inherits = "release"
debug = true
strip = false

[workspace.metadata.bin]
# The version of hax to use, matching the `hax-lib` the project depends on.
cargo-hax = { version = "0.4.0", bins = ["cargo-hax"], locked = true }
