# hax configuration for `libcrux-iot-ml-kem`. Replaces the former `hax_aeneas.py`
# driver. Extract with `cargo hax extract` (runs the scenario below).
#
# The scenario is named after the cargo package so hax derives the existing Lean
# package name `LibcruxIotMlKem`, and writes into the existing `proofs/lean/`
# layout (hax warns this is the scenario-less layout; that is intentional).
# The charon `--start-from` roots and `--opaque` items are the extraction scope
# the driver used to pass on the command line; they are load-bearing (without
# them the whole crate is extracted and aeneas cannot translate the SHAKE bodies).
# Tool versions are pinned workspace-wide in `../hax.toml`.
[scenario.libcrux-iot-ml-kem]
backend = "lean"
output-dir = "proofs/lean"
charon-args = [
  "--start-from",
  "crate::vector::*",
  "--start-from",
  "crate::polynomial::*",
  "--start-from",
  "crate::ntt::*",
  "--start-from",
  "crate::invert_ntt::*",
  "--start-from",
  "crate::matrix::*",
  "--start-from",
  "crate::serialize::*",
  "--start-from",
  "crate::ind_cpa::serialize_vector",
  "--start-from",
  "crate::ind_cpa::serialize_unpacked_secret_key",
  "--start-from",
  "crate::ind_cpa::compress_then_serialize_u",
  "--start-from",
  "crate::ind_cpa::deserialize_then_decompress_u",
  "--start-from",
  "crate::ind_cpa::deserialize_vector",
  "--start-from",
  "crate::ind_cpa::encrypt_c2",
  "--start-from",
  "crate::ind_cpa::decrypt_unpacked",
  "--start-from",
  "crate::ind_cpa::decrypt",
  "--opaque",
  "crate::hash_functions::portable::*",
  "--opaque",
  "crate::sampling::*",
  "--opaque",
  "crate::matrix::sample_matrix_A",
  "--opaque",
  "crate::matrix::sample_matrix_entry"
]
