name = "LibcruxIotMlKem"
version = "0.1.0"
defaultTargets = ["LibcruxIotMlKem"]

[[lean_lib]]
name = "LibcruxIotMlKem"
# No module glob: the library is driven by the `LibcruxIotMlKem` root module's
# import tree, so the generated `Extraction/ProofObligations.lean` (sorry bodies,
# @[spec]-tagged, imported by nothing) stays on disk but OUT of the build.
globs = ["LibcruxIotMlKem"]

[[require]]
name = "Hax"
git = "https://github.com/cryspen/hax-lean"
rev = "v0.3.17"

# The machine-extracted ML-KEM hacspec (crate `hacspec_ml_kem`, specs/ml-kem in
# celabshq/libcrux); the proofs reference `hacspec_ml_kem.*`. Transitively brings
# in HacspecSha3 (the spec references `hacspec_sha3.*`).
# Pinned by COMMIT SHA, not by branch name: 6e39ccd9 is the specs commit that
# replaced the specs' hax_aeneas.py drivers with hax.toml (hax v0.4.0,
# hax-lean v0.3.17), the same commit the Cargo side pins for the hacspec crate.
[[require]]
name = "HacspecMlKem"
git = "https://github.com/celabshq/libcrux"
rev = "6e39ccd988c1ea61d8d5da591ffeb33ce3a64b45"
subDir = "specs/ml-kem/proofs/lean"
