name = "LibcruxIotMlKem"
version = "0.1.0"
defaultTargets = ["LibcruxIotMlKem"]

[[lean_lib]]
name = "LibcruxIotMlKem"
globs = ["LibcruxIotMlKem", "LibcruxIotMlKem.+"]

[[require]]
name = "Hax"
git = "https://github.com/cryspen/hax-lean"
rev = "v0.3.12"

# The machine-extracted ML-KEM hacspec (crate `hacspec_ml_kem`, specs/ml-kem in
# celabshq/libcrux); the proofs reference `hacspec_ml_kem.*`. Transitively brings
# in HacspecSha3 (the spec references `hacspec_sha3.*`).
# Local worktree path until the libcrux-side spec migration is pushed: the
# pinned rev below still carried hax-lean v0.2.0, so lake resolved aeneas to
# the old 52fd4383 and the build died inside hax-lean itself with
# "Unknown identifier `Aeneas.Std.RustM`". TODO: restore a `git`+`rev`
# require pointing at the pushed commit.
[[require]]
name = "HacspecMlKem"
path = "../../../../../../libcrux/hax-v0.4.0-rc.1/specs/ml-kem/proofs/lean"
