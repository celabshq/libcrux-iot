name = "LibcruxIotMlKem"
version = "0.1.0"
defaultTargets = ["LibcruxIotMlKem"]

[[lean_lib]]
name = "LibcruxIotMlKem"
globs = ["LibcruxIotMlKem", "LibcruxIotMlKem.+"]

[[require]]
name = "Hax"
git = "https://github.com/cryspen/hax-lean"
rev = "v0.3.12"

# The machine-extracted ML-KEM hacspec (crate `hacspec_ml_kem`, specs/ml-kem in
# celabshq/libcrux); the proofs reference `hacspec_ml_kem.*`. Transitively brings
# in HacspecSha3 (the spec references `hacspec_sha3.*`).
# Pinned by COMMIT SHA, not by branch name: this is the tip of celabshq/libcrux
# `proofs-update`, the commit that carries the hax v0.4.0-rc.1 spec migration.
# (The earlier pin carried hax-lean v0.2.0, so lake resolved aeneas to the old
# 52fd4383 and the build died inside hax-lean with
# "Unknown identifier `Aeneas.Std.RustM`" -- hence the interim local path, now
# no longer needed.)
[[require]]
name = "HacspecMlKem"
git = "https://github.com/celabshq/libcrux"
rev = "718a601178c06afa6b4b10d143819da38df8770f"
subDir = "specs/ml-kem/proofs/lean"
