[package]
name = "libcrux-iot-ml-kem"
description = "Libcrux ML-KEM & Kyber implementations"
publish = false

readme.workspace = true
version.workspace = true
repository.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true

exclude = [
    "/tests",
    "/implementation_notes.pdf",
    "/c",
    "/proofs",
    "/c.sh",
    "/c.yaml",
    "/hax.py",
]

[lib]
bench = false # so libtest doesn't eat the arguments to criterion

[dependencies]
rand = { version = "0.9", optional = true }
libcrux-iot-sha3 = { path = "../sha3", features = [
    "full-unroll",
    "unbuffered-xof",
] }
hax-lib.workspace = true
# NORMAL (not dev-) dependency: the matrix top-level `#[ensures]` name
# `hacspec_ml_kem::matrix::*` directly, so the hacspec must be in scope for
# the hax build. Pinned to the specs/ml-kem commit (6e39ccd9: specs drivers
# replaced by hax.toml) whose hax-lib matches libcrux-iot (rc.2); a mismatch
# makes charon emit `hax_lib_1`. The same commit is pinned in
# proofs/lean/lakefile.toml for the HacspecMlKem Lean package.
hacspec_ml_kem = { git = "https://github.com/celabshq/libcrux", rev = "6e39ccd988c1ea61d8d5da591ffeb33ce3a64b45" }
libcrux-secrets.workspace = true
libcrux-traits = { version = "0.0.7", features = ["generic-tests"] }
tls_codec = { version = "0.4.2", features = [
    "derive",
], default-features = false, optional = true }

[features]
# By default all variants and std are enabled.
default = ["mlkem512", "mlkem768", "mlkem1024"]

# Serialization & Deserialization using tls_codec
codec = ["dep:tls_codec"]

# Features for the different key sizes of ML-KEM
mlkem512 = []
mlkem768 = []
mlkem1024 = []

# Enable Round 3 Kyber in addition to ML-KEM
kyber = []

# APIs that sample their own randomness
rand = ["dep:rand"]

# std support
std = ["alloc", "rand/std", "tls_codec/std"]
alloc = []


check-secret-independence = [
    "libcrux-secrets/check-secret-independence",
    "libcrux-iot-sha3/check-secret-independence",
    "libcrux-traits/check-secret-independence",
]

# PQCP Common APIs
pqcp = []

[dev-dependencies]
rand = { version = "0.9" }
serde_json = { version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
hex = { version = "0.4.3", features = ["serde"] }
criterion = "0.5"
libcrux-kats = { workspace = true, features = ["mlkem"] }

# Cross-spec equivalence tests against the hacspec ML-KEM
# Pinned to the SAME repo and commit as the Hacspec* Lean package in
# proofs/lean/lakefile.toml, so the Rust cross-spec tests and the Lean proofs
# check against one single spec revision. These used to disagree: this was
# cryspen/libcrux@a4cfb1eb while the lakefile was celabshq/libcrux@718a6011.
proptest = "1"

[[test]]
name = "cross_spec"
required-features = ["mlkem512", "mlkem768", "mlkem1024"]

[[test]]
name = "cross_spec_proptests"
required-features = ["mlkem512", "mlkem768", "mlkem1024"]

[[bench]]
name = "ml-kem"
harness = false

[[example]]
name = "encapsulate"
required-features = ["mlkem768"]

[[example]]
name = "decapsulate"
required-features = ["mlkem768"]

[[example]]
name = "keygen"
required-features = ["mlkem768"]

[package.metadata."docs.rs"]
features = ["pre-verification", "kyber"]
rustdoc-args = ["--cfg", "doc_cfg"]

[lints]
workspace = true
