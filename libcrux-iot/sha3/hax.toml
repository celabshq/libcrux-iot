# hax configuration for the `libcrux-iot-sha3` crate. Replaces the former
# `hax_aeneas.py` post-processing driver. Extract with `cargo hax extract`
# (runs the scenario below; the scenario is named after the cargo package so
# hax derives the existing Lean package name `LibcruxIotSha3`, and writes into
# the existing `proofs/lean/` layout -- hax warns this is the scenario-less
# layout; that is intentional). Tool versions are pinned workspace-wide in
# `../hax.toml`.
#
# With hax v0.4.0 the extraction needs no post-processing: hax sets the
# `hax_backend_lean` cfg itself (so the `#[cfg(not(hax_backend_lean))]`-gated
# `loop_invariant!` calls are dropped and no undeclared marker is emitted), fills
# the `PartialEq.ne`/`Clone.clone_from` record fields, fixes the `lane` namespace
# shadowing, and no longer imports the (sorry-filled) generated
# `Extraction.ProofObligations` from the aggregator. `Extraction/ProofObligations.lean`
# is therefore left on disk but kept out of the build by the import-tree-driven
# `proofs/lean/lakefile.toml` (no module glob). The whole crate is in scope
# (no `--start-from`/`--opaque` needed).
[scenario.libcrux-iot-sha3]
backend = "lean"
output-dir = "proofs/lean"
