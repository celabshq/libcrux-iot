[package]
name = "libcrux-iot-sha3"
description = "Libcrux-IoT SHA-3 implementation"
exclude = ["/c.sh", "/c.yaml", "/tests/tv", "tests/cavp.rs"]
publish = false

readme.workspace = true
version.workspace = true
repository.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true

[lib]
bench = false # so libtest doesn't eat the arguments to criterion

[dependencies]
libcrux-secrets.workspace = true
libcrux-traits.workspace = true
hax-lib.workspace = true

# XXX: Unfortunately, it's not possible to use certain hax attributes
# with `cfg_attr`, which means we can't have hax-lib as a `cfg(hax)`
# only dependency. (See https://github.com/cryspen/hax/issues/1496)
# # This is only required for verification.
# # The hax config is set by the hax toolchain.
# [target.'cfg(hax)'.dependencies]
# hax-lib.workspace = true

[features]
full-unroll = []

# Expose unbuffered XOF functionality for cases where the exact
# absorption and squeeze lengths are known, e.g. ML-KEM or ML-DSA.
unbuffered-xof = []

# Turn on secret-independence checking via `libcrux-secrets`
check-secret-independence = [
    "libcrux-secrets/check-secret-independence",
    "libcrux-traits/check-secret-independence",
]

[dev-dependencies]
criterion = "0.5.1"
hex = "0.4.3"
rand = "0.8.5"
pretty_env_logger = "0.5.0"
hacspec_sha3 = { git = "https://github.com/cryspen/libcrux.git", rev = "a4cfb1ebf26431b2ee81f0dc19383158aaf397b7" }
proptest = "1.2.0"
libcrux-kats = { workspace = true, features = ["sha3"] }

[lints]
workspace = true
