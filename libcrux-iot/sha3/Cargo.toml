[package]
name = "libcrux-iot-sha3"
description = "Libcrux-IoT SHA-3 implementation"
exclude = ["/c.sh", "/c.yaml", "/tests/tv", "tests/cavp.rs"]
publish = false

readme.workspace = true
version.workspace = true
repository.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true

[lib]
bench = false # so libtest doesn't eat the arguments to criterion

[dependencies]
libcrux-secrets.workspace = true
libcrux-traits.workspace = true
hax-lib.workspace = true
# The machine-extracted FIPS-202 hacspec. A NORMAL (not dev-) dependency
# because `sha256_ema`'s `#[ensures]` names `hacspec_sha3::sha3_256` directly,
# so it must be in scope for the hax build; `cargo test` sees it too.
#
# daba41a6 is the specs/sha3 hax v0.4.0-rc.2 bump, and the SAME commit
# `proofs/lean/lakefile.toml` pins for the `HacspecSha3` Lean package, so the
# Rust side and the Lean side check the same spec content. It also pins
# specs/sha3's own hax-lib to the rc.2 rev; without that, cargo resolves two
# different hax-libs and the extraction breaks (see the note in
# proofs/lean/LibcruxIotSha3/Verification/ProofObligations.lean).
# NOT YET PUSHED to celabshq/libcrux: until it is, a fresh checkout must use
# the local-path form (scratchpad dep2.py) to build or extract.
hacspec_sha3 = { git = "https://github.com/celabshq/libcrux.git", rev = "daba41a6bffa3bbdbb0e3f5710590086f95da1d0" }

# XXX: Unfortunately, it's not possible to use certain hax attributes
# with `cfg_attr`, which means we can't have hax-lib as a `cfg(hax)`
# only dependency. (See https://github.com/cryspen/hax/issues/1496)
# # This is only required for verification.
# # The hax config is set by the hax toolchain.
# [target.'cfg(hax)'.dependencies]
# hax-lib.workspace = true

[features]
full-unroll = []

# Expose unbuffered XOF functionality for cases where the exact
# absorption and squeeze lengths are known, e.g. ML-KEM or ML-DSA.
unbuffered-xof = []

# Turn on secret-independence checking via `libcrux-secrets`
check-secret-independence = [
    "libcrux-secrets/check-secret-independence",
    "libcrux-traits/check-secret-independence",
]

[dev-dependencies]
criterion = "0.5.1"
hex = "0.4.3"
rand = "0.8.5"
pretty_env_logger = "0.5.0"
proptest = "1.2.0"
libcrux-kats = { workspace = true, features = ["sha3"] }

[lints]
workspace = true
