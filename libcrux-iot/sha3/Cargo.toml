[package]
name = "libcrux-iot-sha3"
description = "Libcrux-IoT SHA-3 implementation"
exclude = ["/c.sh", "/c.yaml", "/tests/tv", "tests/cavp.rs"]
publish = false

readme.workspace = true
version.workspace = true
repository.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true

[lib]
bench = false # so libtest doesn't eat the arguments to criterion

[dependencies]
libcrux-secrets.workspace = true
libcrux-traits.workspace = true
hax-lib.workspace = true
# The two machine-extracted FIPS-202 hacspecs. NORMAL (not dev-) dependencies
# because the `#[ensures]` clauses name `hacspec_sha3{,_pedantic}::…` directly,
# so they must be in scope for the hax build; `cargo test` sees them too.
#
# `hacspec_sha3` is the spec the proofs were built against; `hacspec_sha3_pedantic`
# is the FIPS 202 transcript the proofs are being moved onto (bridged in the Lean
# tree by `LibcruxIotSha3/Composition/Pedantic/`).  Both are pinned by COMMIT SHA,
# at the same revision as the corresponding `[[require]]`s in
# `proofs/libcrux-iot-sha3/lean/lakefile.toml`.
hacspec_sha3 = { git = "https://github.com/celabshq/libcrux.git", rev = "6aeb457febf4bbfe0b0faee482dc4e76f76fb081" }
hacspec_sha3_pedantic = { git = "https://github.com/celabshq/libcrux.git", rev = "6aeb457febf4bbfe0b0faee482dc4e76f76fb081" }

# XXX: Unfortunately, it's not possible to use certain hax attributes
# with `cfg_attr`, which means we can't have hax-lib as a `cfg(hax)`
# only dependency. (See https://github.com/cryspen/hax/issues/1496)
# # This is only required for verification.
# # The hax config is set by the hax toolchain.
# [target.'cfg(hax)'.dependencies]
# hax-lib.workspace = true

[features]
full-unroll = []

# Expose unbuffered XOF functionality for cases where the exact
# absorption and squeeze lengths are known, e.g. ML-KEM or ML-DSA.
unbuffered-xof = []

# Turn on secret-independence checking via `libcrux-secrets`
check-secret-independence = [
    "libcrux-secrets/check-secret-independence",
    "libcrux-traits/check-secret-independence",
]

[dev-dependencies]
criterion = "0.5.1"
hex = "0.4.3"
rand = "0.8.5"
pretty_env_logger = "0.5.0"
proptest = "1.2.0"
libcrux-kats = { workspace = true, features = ["sha3"] }

[lints]
workspace = true
