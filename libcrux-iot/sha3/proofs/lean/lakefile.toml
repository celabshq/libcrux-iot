name = "LibcruxIotSha3"
version = "0.1.0"
defaultTargets = ["LibcruxIotSha3"]

[[lean_lib]]
name = "LibcruxIotSha3"
globs = ["LibcruxIotSha3", "LibcruxIotSha3.+"]

[[require]]
name = "Hax"
git = "https://github.com/cryspen/hax-lean"
rev = "v0.3.12"

# The machine-extracted FIPS-202 hacspec (crate `hacspec_sha3`, specs/sha3 in
# celabshq/libcrux); the proofs reference `hacspec_sha3.*`.
# Local worktree path until the libcrux-side spec migration is pushed: the
# pinned rev below still carried hax-lean v0.2.0, so lake resolved aeneas to
# the old 52fd4383 and the build died inside hax-lean itself with
# "Unknown identifier `Aeneas.Std.RustM`". TODO: restore a `git`+`rev`
# require pointing at the pushed commit.
[[require]]
name = "HacspecSha3"
path = "../../../../../../libcrux/hax-v0.4.0-rc.1/specs/sha3/proofs/lean"
