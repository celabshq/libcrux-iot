name = "LibcruxIotSha3"
version = "0.1.0"
defaultTargets = ["LibcruxIotSha3"]

[[lean_lib]]
name = "LibcruxIotSha3"
globs = ["LibcruxIotSha3", "LibcruxIotSha3.+"]

[[require]]
name = "Hax"
git = "https://github.com/cryspen/hax-lean"
rev = "v0.2.0"

# The machine-extracted FIPS-202 hacspec (crate `hacspec_sha3`, specs/sha3 in
# celabshq/libcrux); the proofs reference `hacspec_sha3.*`.
[[require]]
name = "HacspecSha3"
git = "https://github.com/celabshq/libcrux"
rev = "12c12222c87cdd5ad5dcc1fa971a5efd30549859"
subDir = "specs/sha3/proofs/lean"
