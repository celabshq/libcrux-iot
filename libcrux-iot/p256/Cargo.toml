[package]
description = "Formally verified P-256 implementation"
name = "libcrux-p256"
readme = "Readme.md"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version = "0.0.8"

[dependencies]
libcrux-hacl-rs = "*"
libcrux-macros = "*"
libcrux-secrets = "*"
libcrux-traits = "*"
libcrux-sha2 = { version = "*", features = ["expose-hacl"] }

[features]
expose-hacl = []

# Checking secret independence
check-secret-independence = [
    "libcrux-secrets/check-secret-independence",
    "libcrux-traits/check-secret-independence",
]

[dev-dependencies]
der = "0.8.0"
libcrux-kats = { workspace = true, features = ["ecdh", "ecdsa"] }
libcrux-p256 = { path = ".", features = ["expose-hacl"] }
libcrux-traits = { workspace = true, features = ["generic-tests"] }
